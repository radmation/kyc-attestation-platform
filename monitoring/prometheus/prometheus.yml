global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # NestJS backend metrics
  - job_name: 'nestjs-backend'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 5s
    scrape_timeout: 5s

  # Hyperledger Fabric Peer metrics
  - job_name: 'fabric-peer'
    static_configs:
      - targets: ['host.docker.internal:9443']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Hyperledger Fabric Orderer metrics
  - job_name: 'fabric-orderer'
    static_configs:
      - targets: ['host.docker.internal:8443']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL database metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
    scrape_interval: 30s

  # System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Docker metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
